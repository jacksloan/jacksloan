<!DOCTYPE html>
<html lang="en">
<head>
	<title>Jack Sloan | Projects</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="A list of Jack's open source projects" />
	<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
	<style>
		body { background-color: rgb(249 250 251); color: black; }
		.prose a:not(h2 a, h3 a, h4 a, h5 a, h6 a) { color: rgb(99 102 241); }
	</style>
</head>
<body>
	<div class="sm:pt-6 sm:pb-10">

		<!-- Navbar -->
		<nav class="flex justify-between px-4 py-4 mx-auto sm:px-8 max-w-2xl">
			<div class="text-gray-700 text-sm">
				<a href="/" class="mr-6 hover:text-gray-900 transition-colors">Home</a>
				<a href="/projects.html" class="mr-6 font-bold">Projects</a>
			</div>
			<div class="text-gray-500 flex items-center space-x-3 text-sm">
				<a href="https://github.com/jacksloan" target="_blank" rel="noopener" aria-label="Jack's Github" class="hover:text-gray-700 transition-colors">
					<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/></svg>
				</a>
				<a href="https://www.linkedin.com/in/jack-sloan/" target="_blank" rel="noopener" aria-label="Jack's LinkedIn" class="hover:text-gray-700 transition-colors">
					<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
				</a>
			</div>
		</nav>

		<!-- Main card -->
		<main class="px-4 py-10 m-auto sm:px-8 sm:rounded-lg max-w-2xl sm:shadow bg-white ring-1 ring-gray-200">
			<article class="prose max-w-none">
				<h2>Projects</h2>
			</article>
			<ul id="repos" class="mt-4 divide-y divide-gray-100"></ul>
		</main>

	</div>
	<script>
		fetch('https://api.github.com/users/jacksloan/repos')
			.then(r => r.json())
			.then(repos => {
				const active = repos
					.filter(r => !r.archived && !r.private && !r.fork)
					.sort((a, b) => b.stargazers_count - a.stargazers_count);

				const list = document.getElementById('repos');
				list.innerHTML = active.map(r => `
					<li class="py-4">
						<div class="flex items-center justify-between gap-2">
							<h3 class="text-base font-semibold">
								<a href="${r.html_url}" target="_blank" rel="noopener" class="text-indigo-500 hover:text-indigo-600 transition-colors">${r.name}</a>
							</h3>
							${r.stargazers_count > 0 ? `<span class="text-sm text-gray-500 shrink-0">&#9733; ${r.stargazers_count}</span>` : ''}
						</div>
						<p class="mt-1 text-sm text-gray-600">${r.description || ''}</p>
						${r.topics.length ? `<ul class="flex flex-wrap gap-1 mt-2" aria-label="github project topics">${r.topics.map(t => `<li class="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 ring-1 ring-indigo-100">${t}</li>`).join('')}</ul>` : ''}
					</li>
				`).join('');
			});
	</script>
</body>
</html>
