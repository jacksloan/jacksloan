<!DOCTYPE html>
<html lang="en">
<head>
	<title>Jack Sloan | Projects</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="A list of Jack's open source projects" />
	<link rel="canonical" href="https://jacksloan.dev/projects.html" />
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://jacksloan.dev/projects.html" />
	<meta property="og:title" content="Jack Sloan | Projects" />
	<meta property="og:description" content="A list of Jack's open source projects" />
	<meta name="view-transition" content="same-origin" />
	<script src="scripts/theme-init.js"></script>
	<script src="scripts/nav.js"></script>
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<site-nav></site-nav>

	<main>
		<h2>Projects</h2>
		<div id="loading" aria-label="Loading projects"></div>
		<ul id="repos" hidden></ul>
	</main>

	<script>
		document.getElementById('loading').style.display = 'flex';
		fetch('https://api.github.com/users/jacksloan/repos')
			.then(r => r.json())
			.then(repos => {
				const active = repos
					.filter(r => !r.archived && !r.private && !r.fork)
					.sort((a, b) => b.stargazers_count - a.stargazers_count);

				document.getElementById('repos').innerHTML = active.map(r => `
					<li>
						<div class="repo-header">
							<h3><a href="${r.html_url}" target="_blank" rel="noopener">${r.name}</a></h3>
							${r.stargazers_count > 0 ? `<span class="stars">&#9733; ${r.stargazers_count}</span>` : ''}
						</div>
						<p>${r.description || ''}</p>
						${r.topics.length ? `<ul class="topics" aria-label="github project topics">${r.topics.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
					</li>
				`).join('');

				document.getElementById('loading').style.display = 'none';
				document.getElementById('repos').removeAttribute('hidden');
			});
	</script>
	<script src="scripts/theme.js"></script>
</body>
</html>
